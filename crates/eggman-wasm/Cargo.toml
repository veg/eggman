[package]
name = "eggman-wasm"
version = "0.2.0"
edition = "2021"
description = "WebAssembly bindings for EGGMAN coordinate-anchored viral subtyping and mosaic deconvolution"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
eggman-core = { path = "../eggman-core" }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
