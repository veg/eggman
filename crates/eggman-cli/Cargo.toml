[package]
name = "eggman-cli"
version = "0.2.0"
edition = "2021"
description = "EGGMAN command-line coordinate-anchored viral recombination, reassortment, and subtyping engine"
license = "MIT"

[[bin]]
name = "eggman"
path = "src/main.rs"

[dependencies]
eggman-core = { path = "../eggman-core" }
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
